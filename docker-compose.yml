services:
  app:
    image: serversideup/php:8.4-unit
    container_name: pipl_app
    restart: unless-stopped
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY}
      - DB_HOST=database
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - PUID=1000
      - PGID=1000
    ports:
      - "8888:8080"
    volumes:
      - ./:/var/www/html
    networks:
      - pipl_net
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16
    container_name: pipl_database
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE:-pipl}
      - POSTGRES_USER=${DB_USERNAME:-pipl_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-pipl_secret_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pipl_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pipl_user} -d ${DB_DATABASE:-pipl}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  pipl_net:
    driver: bridge
